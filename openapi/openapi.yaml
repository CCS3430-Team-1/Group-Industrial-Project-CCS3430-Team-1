openapi: 3.1.0
info:
  title: WE LEAD Donation Platform API
  version: 1.0.0
  description: |
    API contract v1 for the WE LEAD Donation Platform (issue #13, ADR 0001).
    Single source of truth between the front ends and the back end. Any change
    needs approval from both the back-end and the front-end lead.

    Conventions:
    - Amounts are integer euro cents (500 = 5.00 EUR). Currency is always EUR.
    - Dates and times are ISO 8601 in UTC.
    - Staff endpoints use the `wl_session` cookie set by `POST /auth/login`.
    - `x-roles` lists the staff roles allowed on an endpoint.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose (through the web container)
  - url: http://localhost:4010
    description: Prism mock server
tags:
  - name: Public
    description: Donor-facing endpoints, no login.
  - name: Payments
    description: Viva hosted checkout return and webhooks.
  - name: Auth
    description: Staff login.
  - name: Admin
    description: Manager-only endpoints.
  - name: Reports
    description: Read-only figures for managers and reporters.
  - name: System
    description: Health check.

security:
  - cookieAuth: []

paths:
  /content:
    get:
      tags: [Public]
      operationId: getContent
      summary: Get the donation page content
      description: Why-donate text, impact numbers and bank transfer details.
      security: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Page content in the requested language (falls back to English).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /donations:
    post:
      tags: [Public]
      operationId: createDonation
      summary: Create a donation and start the Viva checkout
      description: |
        Validates the input, saves a PENDING donation and creates a Viva
        payment order. The front end redirects the browser to `checkoutUrl`.
        For MONTHLY donations the order allows recurring charges.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCreate'
      responses:
        '201':
          description: Donation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckout'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/ProviderError'

  /donations/{ref}/status:
    get:
      tags: [Public]
      operationId: getDonationStatus
      summary: Get the status of a donation
      description: Used by the result pages. Returns no personal data.
      security: []
      parameters:
        - $ref: '#/components/parameters/DonationRef'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationStatusView'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/cancel:
    post:
      tags: [Public]
      operationId: cancelSubscription
      summary: Cancel a monthly donation
      description: Self-service cancellation with the token from the donor's confirmation e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCancel'
      responses:
        '200':
          description: Subscription cancelled (also returned if it was already cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCancelled'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/return:
    post:
      tags: [Payments]
      operationId: handlePaymentReturn
      summary: Report the donor's return from Viva
      description: |
        Called by the result page with the order code Viva adds to the return URL.
        `failure` marks a still-PENDING donation as CANCELLED. `success` never
        marks a donation PAID; only the webhook does that, so the front end
        polls `GET /donations/{ref}/status` until the status is final.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReturn'
      responses:
        '200':
          description: Donation status after handling the return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationStatusView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/viva:
    get:
      tags: [Payments]
      operationId: verifyVivaWebhook
      summary: Viva webhook URL verification
      description: Returns the verification key that the API retrieves from Viva, as Viva requires when the webhook is registered.
      security: []
      responses:
        '200':
          description: Verification key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaWebhookKey'
    post:
      tags: [Payments]
      operationId: receiveVivaWebhook
      summary: Receive a Viva payment event
      description: |
        Handles Transaction Payment Created (EventTypeId 1796) and Transaction
        Failed (1798). Other event types are acknowledged and ignored.
        The event is stored once; the API then fetches the transaction from
        Viva and checks order code and amount before changing the donation.
        Any non-2xx reply makes Viva retry hourly, so the API replies 200 once
        the event is stored, including for duplicates.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaWebhookEvent'
      responses:
        '200':
          description: Event stored (or already known).
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Staff login
      description: On success sets the `wl_session` cookie (HTTP-only, Secure, SameSite=Strict, 8 hours).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: '`wl_session=<jwt>; HttpOnly; Secure; SameSite=Strict; Path=/api; Max-Age=28800`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Staff logout
      description: Clears the session cookie.
      x-roles: [MANAGER, REPORTER]
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in user
      x-roles: [MANAGER, REPORTER]
      responses:
        '200':
          description: Current user and role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/donations:
    get:
      tags: [Admin]
      operationId: listDonations
      summary: List donations
      description: Filtered, searched and paginated on the server, newest first.
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of donations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/donations/export:
    get:
      tags: [Admin]
      operationId: exportDonations
      summary: Export donations as CSV
      description: Same filters as the list, without pagination. Columns follow `AdminDonation`.
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/CsvFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/opt-ins:
    get:
      tags: [Admin]
      operationId: listOptIns
      summary: List newsletter opt-ins
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of opt-ins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/opt-ins/export:
    get:
      tags: [Admin]
      operationId: exportOptIns
      summary: Export newsletter opt-ins as CSV
      x-roles: [MANAGER]
      responses:
        '200':
          $ref: '#/components/responses/CsvFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content:
    get:
      tags: [Admin]
      operationId: getAdminContent
      summary: Get editable page content
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Current content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin]
      operationId: updateContent
      summary: Update page content
      description: Replaces the content for one language. Visible on the donation page immediately.
      x-roles: [MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageContent'
      responses:
        '200':
          description: Saved content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/totals:
    get:
      tags: [Reports]
      operationId: getTotals
      summary: Total of paid donations
      x-roles: [MANAGER, REPORTER]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Totals for the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Totals'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/monthly-trend:
    get:
      tags: [Reports]
      operationId: getMonthlyTrend
      summary: Paid donations per month
      x-roles: [MANAGER, REPORTER]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One row per month, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTrend'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/split:
    get:
      tags: [Reports]
      operationId: getSplit
      summary: One-off versus monthly donations
      x-roles: [MANAGER, REPORTER]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Split for the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Split'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/export:
    get:
      tags: [Reports]
      operationId: exportReport
      summary: Export monthly figures as CSV
      description: 'Columns: month, oneOffCount, oneOffAmountCents, monthlyCount, monthlyAmountCents. No donor data.'
      x-roles: [MANAGER, REPORTER]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/CsvFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: API and database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: Database not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wl_session
      description: Signed JWT set by `POST /auth/login`. Carries the user id and role.

  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Locale'
    DonationRef:
      name: ref
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DonationRef'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DonationStatus'
    TypeFilter:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DonationType'
    From:
      name: from
      in: query
      required: false
      description: Start date, inclusive.
      schema:
        type: string
        format: date
        examples: ['2026-11-01']
    To:
      name: to
      in: query
      required: false
      description: End date, inclusive.
      schema:
        type: string
        format: date
        examples: ['2026-11-30']
    Search:
      name: q
      in: query
      required: false
      description: Matches donor name or e-mail.
      schema:
        type: string
        maxLength: 100

  responses:
    ValidationError:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request is invalid.
              details:
                - field: amountCents
                  message: Must be between 500 and 1000000.
    Unauthorized:
      description: Not logged in, session expired, or wrong e-mail or password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Please log in.
    Forbidden:
      description: Logged in, but the role is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Your role cannot access this page.
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not found.
    TooManyRequests:
      description: Too many login attempts.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Too many attempts. Try again later.
    ProviderError:
      description: The payment provider could not be reached. The donation stays PENDING.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PROVIDER_ERROR
              message: The payment service is not available. Please try again.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong.
    CsvFile:
      description: CSV file (UTF-8, comma-separated, header row).
      headers:
        Content-Disposition:
          description: '`attachment; filename="<name>-<yyyy-mm-dd>.csv"`'
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string

  schemas:
    Locale:
      type: string
      enum: [en, el]
      default: en
    DonationRef:
      type: string
      description: Random public reference of a donation.
      pattern: '^[A-Za-z0-9_-]{12,32}$'
      examples: ['d_8fK2xQ9mLp3T']
    AmountCents:
      type: integer
      description: Amount in euro cents (5 to 10,000 EUR).
      minimum: 500
      maximum: 1000000
      examples: [2000]
    DonationType:
      type: string
      enum: [ONE_OFF, MONTHLY]
    DonationStatus:
      type: string
      enum: [PENDING, PAID, FAILED, CANCELLED]
    Role:
      type: string
      enum: [MANAGER, REPORTER]

    DonationCreate:
      type: object
      additionalProperties: false
      required: [amountCents, type, fullName, email]
      properties:
        amountCents:
          $ref: '#/components/schemas/AmountCents'
        type:
          $ref: '#/components/schemas/DonationType'
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          examples: ['Maria Papadopoulou']
        email:
          type: string
          format: email
          maxLength: 254
          examples: ['maria@example.com']
        newsletterOptIn:
          type: boolean
          default: false
          description: '"Keep me updated about WE LEAD''s news and programs." Unticked by default.'
        locale:
          $ref: '#/components/schemas/Locale'

    DonationCheckout:
      type: object
      required: [ref, status, checkoutUrl]
      properties:
        ref:
          $ref: '#/components/schemas/DonationRef'
        status:
          $ref: '#/components/schemas/DonationStatus'
        checkoutUrl:
          type: string
          format: uri
          description: Viva hosted checkout page for this donation.
          examples: ['https://demo.vivapayments.com/web/checkout?ref=1234567890123456']

    DonationStatusView:
      type: object
      required: [ref, status, type, amountCents, currency]
      properties:
        ref:
          $ref: '#/components/schemas/DonationRef'
        status:
          $ref: '#/components/schemas/DonationStatus'
        type:
          $ref: '#/components/schemas/DonationType'
        amountCents:
          $ref: '#/components/schemas/AmountCents'
        currency:
          type: string
          const: EUR

    SubscriptionCancel:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          description: Token from the cancel link in the confirmation e-mail.

    SubscriptionCancelled:
      type: object
      required: [status, cancelledAt]
      properties:
        status:
          type: string
          const: CANCELLED
        cancelledAt:
          type: string
          format: date-time

    PaymentReturn:
      type: object
      additionalProperties: false
      required: [orderCode, result]
      properties:
        orderCode:
          type: string
          pattern: '^[0-9]{10,20}$'
          description: Viva order code from the return URL.
        result:
          type: string
          enum: [success, failure]
          description: Which return URL Viva sent the donor to.

    VivaWebhookKey:
      type: object
      required: [Key]
      properties:
        Key:
          type: string
          description: Verification key retrieved from Viva.

    VivaWebhookEvent:
      type: object
      description: Event sent by Viva. Only the fields the API uses are listed; others are allowed and ignored.
      required: [EventTypeId, EventData]
      properties:
        EventTypeId:
          type: integer
          description: 1796 = Transaction Payment Created, 1798 = Transaction Failed.
          examples: [1796]
        EventData:
          type: object
          required: [TransactionId, OrderCode]
          properties:
            TransactionId:
              type: string
            OrderCode:
              type: integer
              format: int64
            Amount:
              type: number
              description: Amount in euros as sent by Viva. Checked against the transaction fetched from Viva.
            StatusId:
              type: string
          additionalProperties: true
      additionalProperties: true

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    PageContent:
      type: object
      required: [locale, whyDonate, impactNumbers, iban, accountHolder]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        whyDonate:
          type: string
          maxLength: 2000
          description: Short "Why donate" text.
        impactNumbers:
          type: array
          minItems: 0
          maxItems: 2
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                maxLength: 20
                examples: ['1,200+']
              label:
                type: string
                maxLength: 100
                examples: ['women supported in tech']
        iban:
          type: string
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
          examples: ['GR1601101250000000012300695']
        accountHolder:
          type: string
          maxLength: 120
          examples: ['WE LEAD']
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    AdminDonation:
      type: object
      required: [ref, createdAt, fullName, email, amountCents, type, status, newsletterOptIn]
      properties:
        ref:
          $ref: '#/components/schemas/DonationRef'
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
        fullName:
          type: string
        email:
          type: string
          format: email
        amountCents:
          $ref: '#/components/schemas/AmountCents'
        type:
          $ref: '#/components/schemas/DonationType'
        status:
          $ref: '#/components/schemas/DonationStatus'
        newsletterOptIn:
          type: boolean

    OptIn:
      type: object
      required: [fullName, email, optInAt]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        optInAt:
          type: string
          format: date-time

    DonationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminDonation'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    OptInPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OptIn'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Totals:
      type: object
      description: Paid donations only.
      required: [totalAmountCents, donationCount, averageAmountCents]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalAmountCents:
          type: integer
          minimum: 0
        donationCount:
          type: integer
          minimum: 0
        averageAmountCents:
          type: integer
          minimum: 0

    MonthlyTrend:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            type: object
            required: [month, amountCents, count]
            properties:
              month:
                type: string
                pattern: '^[0-9]{4}-[0-9]{2}$'
                examples: ['2026-11']
              amountCents:
                type: integer
                minimum: 0
              count:
                type: integer
                minimum: 0

    Split:
      type: object
      required: [oneOff, monthly]
      properties:
        oneOff:
          $ref: '#/components/schemas/SplitPart'
        monthly:
          $ref: '#/components/schemas/SplitPart'

    SplitPart:
      type: object
      required: [count, amountCents]
      properties:
        count:
          type: integer
          minimum: 0
        amountCents:
          type: integer
          minimum: 0

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable code, e.g. VALIDATION_ERROR.
            message:
              type: string
              description: Human-readable message (English).
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
